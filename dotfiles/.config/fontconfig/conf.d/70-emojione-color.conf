<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- Add emoji generic family -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <!-- Aliases for the other emoji fonts -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Apple Color Emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Segoe UI Emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Segoe UI Symbol</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>EmojiOne</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Emoji One</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Android Emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>NotoColorEmoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Noto Emoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Twemoji</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>EmojiSymbols</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Symbola</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <!-- Do not allow any app to fallback to Symbola, ever -->
 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <string>Symbola</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>
 <match target="pattern">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
</fontconfig>
